name: CI & macOS Bundle

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-rust-and-ui:
    name: Rust Workspace & Frontend Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri WebKitGTK build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config build-essential libsqlite3-dev libssl-dev \
            libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Frontend install, typecheck, Vitest & Vite build
        run: |
          pnpm install
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Run full Cargo workspace test suite (incl. SQLCipher, DSP Voiceprints & MCP)
        run: cargo test --workspace

  build-macos-bundle:
    name: Build Signed Apple Silicon (M1–M5) v0.6.1 .dmg & .app.zip
    runs-on: macos-15
    needs: verify-rust-and-ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies & build UI
        run: |
          pnpm install
          pnpm run build

      - name: Compile Native Swift macOS Sensor (Non-Ducking Dual-Audio Stream, Vision OCR, AX, EventKit)
        run: |
          mkdir -p macos-sensor/build
          swiftc -O \
            -target arm64-apple-macos13.0 \
            macos-sensor/Sources/main.swift \
            -framework AppKit \
            -framework ApplicationServices \
            -framework CoreGraphics \
            -framework CoreAudio \
            -framework CoreMedia \
            -framework AVFoundation \
            -framework Vision \
            -framework EventKit \
            -framework ScreenCaptureKit \
            -o macos-sensor/build/backtext-macos-sensor
          chmod 755 macos-sensor/build/backtext-macos-sensor
          file macos-sensor/build/backtext-macos-sensor
          ./macos-sensor/build/backtext-macos-sensor permissions

      - name: Build Self-Contained Apple Silicon Metal whisper-cli & whisper-server (Static, Embedded Metal)
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=ON
          cmake --build /tmp/whisper.cpp/build --target whisper-cli whisper-server -j
          mkdir -p macos-sensor/build
          cp /tmp/whisper.cpp/build/bin/whisper-cli macos-sensor/build/whisper-cli
          cp /tmp/whisper.cpp/build/bin/whisper-server macos-sensor/build/whisper-server
          chmod 755 macos-sensor/build/whisper-cli macos-sensor/build/whisper-server
          file macos-sensor/build/whisper-cli macos-sensor/build/whisper-server
          otool -L macos-sensor/build/whisper-cli
          otool -L macos-sensor/build/whisper-server
          ./macos-sensor/build/whisper-cli --help | head -n 5
          ./macos-sensor/build/whisper-server --help | head -n 5

      - name: Build Apple Silicon (arm64) backtext-mcp & Tauri .app bundle
        run: |
          cargo build --release --target aarch64-apple-darwin -p backtext-mcp --bin backtext-mcp
          pnpm tauri build --target aarch64-apple-darwin --bundles app

      - name: Bundle macOS Helpers + Metal whisper-cli & whisper-server, Deep Sign & Smoke-Test on Apple Silicon
        run: |
          APP_DIR="target/aarch64-apple-darwin/release/bundle/macos/backtext.app"
          MCP_BIN="target/aarch64-apple-darwin/release/backtext-mcp"
          SENSOR_BIN="macos-sensor/build/backtext-macos-sensor"
          WHISPER_BIN="macos-sensor/build/whisper-cli"
          WHISPER_SRV="macos-sensor/build/whisper-server"

          cp "$MCP_BIN" "$APP_DIR/Contents/MacOS/backtext-mcp"
          cp "$SENSOR_BIN" "$APP_DIR/Contents/MacOS/backtext-macos-sensor"
          cp "$WHISPER_BIN" "$APP_DIR/Contents/MacOS/whisper-cli"
          cp "$WHISPER_SRV" "$APP_DIR/Contents/MacOS/whisper-server"
          chmod 755 \
            "$APP_DIR/Contents/MacOS/backtext-desktop" \
            "$APP_DIR/Contents/MacOS/backtext-mcp" \
            "$APP_DIR/Contents/MacOS/backtext-macos-sensor" \
            "$APP_DIR/Contents/MacOS/whisper-cli" \
            "$APP_DIR/Contents/MacOS/whisper-server"

          echo "=== Verifying arm64 Mach-O architectures ==="
          file "$APP_DIR/Contents/MacOS/backtext-desktop"
          file "$APP_DIR/Contents/MacOS/backtext-mcp"
          file "$APP_DIR/Contents/MacOS/backtext-macos-sensor"
          file "$APP_DIR/Contents/MacOS/whisper-cli"
          file "$APP_DIR/Contents/MacOS/whisper-server"

          echo "=== Applying deep ad-hoc code signature for Apple Silicon AMFI ==="
          codesign --force --sign - "$APP_DIR/Contents/MacOS/backtext-mcp"
          codesign --force --sign - "$APP_DIR/Contents/MacOS/backtext-macos-sensor"
          codesign --force --sign - "$APP_DIR/Contents/MacOS/whisper-cli"
          codesign --force --sign - "$APP_DIR/Contents/MacOS/whisper-server"
          codesign --force --sign - "$APP_DIR/Contents/MacOS/backtext-desktop"
          codesign --force --deep --sign - "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          echo "=== Smoke-testing live app startup, SQLCipher encryption & bundled Metal whisper-server on arm64 ==="
          CI=true "$APP_DIR/Contents/MacOS/backtext-desktop" &
          APP_PID=$!
          HEALTH_OK=0
          for i in $(seq 1 18); do
            if HEALTH=$(curl -fsS http://127.0.0.1:39421/health); then
              echo "Health response: $HEALTH"
              echo "$HEALTH" | grep -q '"db_encrypted":true'
              TEL=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:39421/api/invoke/get_daemon_telemetry)
              echo "Telemetry: $TEL"
              echo "$TEL" | grep -q '"whisper_cli_detected":true'
              echo "$TEL" | grep -q '"whisper_server_detected":true'
              echo "macOS arm64 startup + SQLCipher + bundled Metal whisper-server smoke-test PASSED!"
              HEALTH_OK=1
              break
            fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "ERROR: backtext-desktop failed to pass arm64 smoke test"
            exit 1
          fi

      - name: Package permission-preserving .dmg & ditto .app.zip with Gatekeeper helper
        run: |
          mkdir -p dist-macos/dmg-staging
          APP_DIR="target/aarch64-apple-darwin/release/bundle/macos/backtext.app"

          ditto "$APP_DIR" dist-macos/dmg-staging/backtext.app
          ln -s /Applications dist-macos/dmg-staging/Applications

          HELPER="dist-macos/dmg-staging/Erster Start (Gatekeeper freischalten).command"
          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' \
            'if [ -d "$SCRIPT_DIR/backtext.app" ]; then' \
            '  echo "Installiere backtext.app nach /Applications..."' \
            '  rm -rf /Applications/backtext.app' \
            '  ditto "$SCRIPT_DIR/backtext.app" /Applications/backtext.app' \
            'fi' \
            'echo "Entferne macOS Quarantäne-Attribut für backtext.app..."' \
            'xattr -cr /Applications/backtext.app' \
            'open /Applications/backtext.app' \
            'echo "backtext v0.6.1 wurde erfolgreich gestartet!"' \
            > "$HELPER"
          chmod 755 "$HELPER"

          hdiutil create -volname "backtext" \
            -srcfolder dist-macos/dmg-staging \
            -ov -format UDZO \
            dist-macos/backtext_0.6.1_macos_arm64.dmg

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_DIR" \
            dist-macos/backtext_0.6.1_macos_arm64.app.zip

          cp target/aarch64-apple-darwin/release/backtext-mcp dist-macos/backtext-mcp-macos-arm64
          chmod 755 dist-macos/backtext-mcp-macos-arm64

      - name: Upload macOS Apple Silicon Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtext-macos-apple-silicon-arm64-v0.6.1
          path: |
            dist-macos/backtext_0.6.1_macos_arm64.dmg
            dist-macos/backtext_0.6.1_macos_arm64.app.zip
            dist-macos/backtext-mcp-macos-arm64

      - name: Publish / Update GitHub Release v0.6.1
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(printf '%s\n' \
            '## backtext v0.6.1 — Hotfix: Volle System-Audio-Lautstärke bei Meetings (kein macOS VoiceProcessingIO-Ducking) & Verstärkter Pure-Rust Echo-Filter (`arm64` · M1–M5 Pro/Max)' \
            '' \
            '### Behoben & Verbessert in v0.6.1' \
            '- **Fix für extrem leises System-Audio bei Meeting-Aufzeichnung:** `AVAudioInputNode.setVoiceProcessingEnabled(true)` (Apple `VoiceProcessingIO`) wurde entfernt, da macOS dadurch automatisch alle anderen Apps (Teams, Zoom, Meet, Browser) um −12 bis −24 dB absenkt (Ducking) und Bluetooth-Headsets umschaltet. Gesprächspartner bleiben jetzt bei 100 % voller Originallautstärke.' \
            '- **Verstärkter Pure-Rust Dual-Channel-Echo-Filter (ohne OS-Ducking):** `suppress_speaker_echo_in_mic` kombiniert jetzt Wellenform-Korrelation (`0–80 ms`) mit einer Raumhall- und Jitter-stabilen `20 ms` RMS-Hüllkurven-Korrelation über `±160 ms`.' \
            '- **Chunk-übergreifende Post-STT Echo-Deduplizierung:** Ein Rolling-Buffer der letzten 5 System-Audio-Äußerungen filtert Lautsprecher-Echos jetzt auch dann zuverlässig aus, wenn ein Satz genau an einer Chunk-Grenze liegt.' \
            '- **Enthält alle v0.6.0-Features:** Warmer Metal-`whisper-server`, 1-Klick In-App Auto-Updater + lokales Signatur-Zertifikat, globaler Diktat-HUD + Word/Safari-Paste-Fix, Templates Studio, Half-Screen-Fix & Meeting-Fokus-Modus.' \
            '' \
            '### Update von v0.6.0' \
            '- Wenn das Repo öffentlich ist: In backtext **Einstellungen → System & Updates → Nach Updates suchen** → **„v0.6.1 jetzt installieren & neu starten“** (1 Klick!).' \
            '- Oder manuell über **`backtext_0.6.1_macos_arm64.dmg`** installieren.')
          if gh release view v0.6.1 >/dev/null 2>&1; then
            gh release upload v0.6.1 \
              dist-macos/backtext_0.6.1_macos_arm64.dmg \
              dist-macos/backtext_0.6.1_macos_arm64.app.zip \
              dist-macos/backtext-mcp-macos-arm64 \
              --clobber
            gh release edit v0.6.1 --notes "$NOTES"
          else
            gh release create v0.6.1 \
              dist-macos/backtext_0.6.1_macos_arm64.dmg \
              dist-macos/backtext_0.6.1_macos_arm64.app.zip \
              dist-macos/backtext-mcp-macos-arm64 \
              --title "backtext v0.6.1 — Hotfix: Volle System-Audio-Lautstärke & verstärkter Pure-Rust Echo-Filter" \
              --notes "$NOTES"
          fi
