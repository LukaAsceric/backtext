name: CI & macOS Bundle

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-rust-and-ui:
    name: Rust Workspace & Frontend Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri WebKitGTK build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config build-essential libsqlite3-dev libssl-dev \
            libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Frontend install, typecheck, Vitest & Vite build
        run: |
          pnpm install
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Run full Cargo workspace test suite (incl. SQLCipher, DSP Voiceprints & MCP)
        run: cargo test --workspace

  build-macos-bundle:
    name: Build Signed Apple Silicon (M1–M5) v0.2.0 .dmg & .app.zip
    runs-on: macos-15
    needs: verify-rust-and-ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies & build UI
        run: |
          pnpm install
          pnpm run build

      - name: Compile Native Swift macOS Sensor (ScreenCaptureKit, Vision OCR, AX, EventKit)
        run: |
          mkdir -p macos-sensor/build
          swiftc -O \
            -target arm64-apple-macos13.0 \
            macos-sensor/Sources/main.swift \
            -framework AppKit \
            -framework ApplicationServices \
            -framework CoreGraphics \
            -framework CoreAudio \
            -framework AVFoundation \
            -framework Vision \
            -framework EventKit \
            -framework ScreenCaptureKit \
            -o macos-sensor/build/backtext-macos-sensor
          chmod 755 macos-sensor/build/backtext-macos-sensor
          file macos-sensor/build/backtext-macos-sensor
          ./macos-sensor/build/backtext-macos-sensor permissions

      - name: Build Apple Silicon (arm64) backtext-mcp & Tauri .app bundle
        run: |
          cargo build --release --target aarch64-apple-darwin -p backtext-mcp --bin backtext-mcp
          pnpm tauri build --target aarch64-apple-darwin --bundles app

      - name: Bundle macOS Helpers, Deep Ad-hoc Sign & Smoke-Test on Apple Silicon
        run: |
          APP_DIR="target/aarch64-apple-darwin/release/bundle/macos/backtext.app"
          MCP_BIN="target/aarch64-apple-darwin/release/backtext-mcp"
          SENSOR_BIN="macos-sensor/build/backtext-macos-sensor"

          cp "$MCP_BIN" "$APP_DIR/Contents/MacOS/backtext-mcp"
          cp "$SENSOR_BIN" "$APP_DIR/Contents/MacOS/backtext-macos-sensor"
          chmod 755 \
            "$APP_DIR/Contents/MacOS/backtext-desktop" \
            "$APP_DIR/Contents/MacOS/backtext-mcp" \
            "$APP_DIR/Contents/MacOS/backtext-macos-sensor"

          echo "=== Verifying arm64 Mach-O architectures ==="
          file "$APP_DIR/Contents/MacOS/backtext-desktop"
          file "$APP_DIR/Contents/MacOS/backtext-mcp"
          file "$APP_DIR/Contents/MacOS/backtext-macos-sensor"

          echo "=== Applying deep ad-hoc code signature for Apple Silicon AMFI ==="
          codesign --force --sign - "$APP_DIR/Contents/MacOS/backtext-mcp"
          codesign --force --sign - "$APP_DIR/Contents/MacOS/backtext-macos-sensor"
          codesign --force --sign - "$APP_DIR/Contents/MacOS/backtext-desktop"
          codesign --force --deep --sign - "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          echo "=== Smoke-testing live app startup, SQLCipher encryption & daemon loop on arm64 ==="
          CI=true "$APP_DIR/Contents/MacOS/backtext-desktop" &
          APP_PID=$!
          HEALTH_OK=0
          for i in $(seq 1 18); do
            if HEALTH=$(curl -fsS http://127.0.0.1:39421/health); then
              echo "Health response: $HEALTH"
              echo "$HEALTH" | grep -q '"db_encrypted":true'
              echo "macOS arm64 startup + SQLCipher smoke-test PASSED!"
              HEALTH_OK=1
              break
            fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "ERROR: backtext-desktop failed to pass arm64 smoke test"
            exit 1
          fi

      - name: Package permission-preserving .dmg & ditto .app.zip with Gatekeeper helper
        run: |
          mkdir -p dist-macos/dmg-staging
          APP_DIR="target/aarch64-apple-darwin/release/bundle/macos/backtext.app"

          ditto "$APP_DIR" dist-macos/dmg-staging/backtext.app
          ln -s /Applications dist-macos/dmg-staging/Applications

          HELPER="dist-macos/dmg-staging/Erster Start (Gatekeeper freischalten).command"
          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' \
            'if [ -d "$SCRIPT_DIR/backtext.app" ]; then' \
            '  echo "Installiere backtext.app nach /Applications..."' \
            '  rm -rf /Applications/backtext.app' \
            '  ditto "$SCRIPT_DIR/backtext.app" /Applications/backtext.app' \
            'fi' \
            'echo "Entferne macOS Quarantäne-Attribut für backtext.app..."' \
            'xattr -cr /Applications/backtext.app' \
            'open /Applications/backtext.app' \
            'echo "backtext v0.2.0 wurde erfolgreich gestartet!"' \
            > "$HELPER"
          chmod 755 "$HELPER"

          hdiutil create -volname "backtext" \
            -srcfolder dist-macos/dmg-staging \
            -ov -format UDZO \
            dist-macos/backtext_0.2.0_macos_arm64.dmg

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_DIR" \
            dist-macos/backtext_0.2.0_macos_arm64.app.zip

          cp target/aarch64-apple-darwin/release/backtext-mcp dist-macos/backtext-mcp-macos-arm64
          chmod 755 dist-macos/backtext-mcp-macos-arm64

      - name: Upload macOS Apple Silicon Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtext-macos-apple-silicon-arm64-v0.2.0
          path: |
            dist-macos/backtext_0.2.0_macos_arm64.dmg
            dist-macos/backtext_0.2.0_macos_arm64.app.zip
            dist-macos/backtext-mcp-macos-arm64

      - name: Publish / Update GitHub Release v0.2.0
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(printf '%s\n' \
            '## backtext v0.2.0 — Alle Phasen (3–6) für Apple Silicon (`arm64` · M1–M5 Pro/Max)' \
            '' \
            '### Neu in v0.2.0' \
            '- **Phase 3 (Autonomer Hintergrund & nativer Swift-Sensor):** Kompilierter `backtext-macos-sensor` (`ScreenCaptureKit` Dual-Audio & Screenshots, `Apple Vision` OCR, `AXUIElement`, `NSPasteboard`), 4s-Daemon-Loop mit Fokus-/Verweildauer-Tracking, Onboarding-Berechtigungs-Check & 1-Klick Beispieldaten-Reset.' \
            '- **Phase 4 (Akustische Voiceprints, Whisper & STT):** Echte 16kHz PCM VAD & 256-dim MFCC/Pitch-Stimmprofile, In-App Whisper GGML Modell-Downloader (Apple Metal), Cloud-STT (Deepgram Nova-3 Diarisierung, OpenAI Whisper, Groq) sowie neuronale Ollama-/OpenAI-Embeddings.' \
            '- **Phase 5 (Keychain, SQLCipher & Live-Streaming):** AES-256 SQLCipher At-Rest-Verschlüsselung, macOS Keychain API-Tresor + Live-Token-Streaming für Anthropic Claude, OpenAI, Google Gemini & Ollama.' \
            '- **Phase 6 (macOS Polish):** Systemweiter `⌥ Space` Global Shortcut für das Hover-Overlay (`NSWindowSharingNone`), nativer `EventKit`- + `.ics`-Kalender-Sync mit Vorbereitungs-Briefings, Login-Autostart & Update-Prüfung.' \
            '' \
            '### Installation auf macOS (M1–M5 Pro)' \
            '1. Lade **`backtext_0.2.0_macos_arm64.dmg`** herunter und ziehe `backtext.app` nach `/Applications`.' \
            '2. Entferne einmalig die Browser-Quarantäne im Terminal:' \
            '```bash' \
            'xattr -cr /Applications/backtext.app && open /Applications/backtext.app' \
            '```')
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 \
              dist-macos/backtext_0.2.0_macos_arm64.dmg \
              dist-macos/backtext_0.2.0_macos_arm64.app.zip \
              dist-macos/backtext-mcp-macos-arm64 \
              --clobber
            gh release edit v0.2.0 --notes "$NOTES"
          else
            gh release create v0.2.0 \
              dist-macos/backtext_0.2.0_macos_arm64.dmg \
              dist-macos/backtext_0.2.0_macos_arm64.app.zip \
              dist-macos/backtext-mcp-macos-arm64 \
              --title "backtext v0.2.0 — macOS Apple Silicon (M1–M5)" \
              --notes "$NOTES"
          fi
