[workspace]
resolver = "2"
members = [
    "crates/backtext-core",
    "crates/backtext-storage",
    "crates/backtext-context",
    "crates/backtext-platform",
    "crates/backtext-meeting",
    "crates/backtext-ai",
    "crates/backtext-mcp",
    "src-tauri",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
regex = "1.11"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
parking_lot = "0.12"

backtext-core = { path = "crates/backtext-core" }
backtext-storage = { path = "crates/backtext-storage" }
backtext-context = { path = "crates/backtext-context" }
backtext-platform = { path = "crates/backtext-platform" }
backtext-meeting = { path = "crates/backtext-meeting" }
backtext-ai = { path = "crates/backtext-ai" }
backtext-mcp = { path = "crates/backtext-mcp" }
