[package]
name = "backtext-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "backtext-desktop"

[lib]
name = "backtext_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "backtext-desktop"
path = "src/main.rs"

[[bin]]
name = "backtext-daemon"
path = "src/bin/backtext-daemon.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon"] }

backtext-core.workspace = true
backtext-storage.workspace = true
backtext-context.workspace = true
backtext-platform.workspace = true
backtext-meeting.workspace = true
backtext-ai.workspace = true
backtext-mcp.workspace = true
